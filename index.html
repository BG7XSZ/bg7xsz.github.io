<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>蚂蚁 BMS 监控</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#eef1f6;--card:#fff;--line:#e8ecf2;--txt:#111827;--dim:#8b95a5;--dim2:#a1aab8;
      --ok:#10b981;--okbg:#ecfdf5;--okbd:#a7f3d0;--blue:#3b82f6;--warn:#f59e0b;--err:#ef4444;
      --warnbg:#fffbeb;--warnbd:#fde68a;--errbg:#fef2f2;--errbd:#fecaca}
body{margin:0;background:var(--bg);color:var(--txt);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  padding:14px;max-width:1100px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:0 0 auto}
.dot.on{background:var(--ok);box-shadow:0 0 0 4px rgba(16,185,129,.15)}
.dot.off{background:var(--err);box-shadow:0 0 0 4px rgba(239,68,68,.12)}
h1{font-size:16px;font-weight:750;letter-spacing:-.2px;margin:0}
.tag{font-size:12px;padding:3px 9px;border-radius:8px;background:#fff;color:#6b7280;
  border:1px solid var(--line);font-weight:500;white-space:nowrap}
.tag.ok{background:var(--okbg);color:#047857;border-color:var(--okbd)}
.tag.warn{background:var(--warnbg);color:#b45309;border-color:var(--warnbd)}
.spacer{flex:1}
.card{background:var(--card);border-radius:18px;padding:14px 16px;border:1px solid var(--line);
  box-shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px -14px rgba(16,24,40,.14)}
.hero{display:grid;grid-template-columns:minmax(240px,1fr) 2fr;gap:12px;margin-bottom:12px}
.soc{display:flex;flex-direction:column;justify-content:center;padding:18px}
.soc .num{font-size:52px;font-weight:800;letter-spacing:-2.5px;line-height:1}
.soc .num span{font-size:19px;font-weight:650;color:var(--dim2);margin-left:2px}
.soc .cap{margin-top:6px;font-size:13px;color:var(--dim)}
.bar{height:8px;border-radius:99px;background:#f1f3f7;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#10b981,#3b82f6);
  transition:width .4s}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.k{font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.3px}
.v{font-size:26px;font-weight:750;letter-spacing:-.8px;margin-top:5px;font-variant-numeric:tabular-nums}
.v small{font-size:12px;color:var(--dim2);font-weight:600;margin-left:3px}
.meta{font-size:12px;color:var(--dim);margin-top:3px}
.sec{margin-top:12px}
.sechd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.sechd .k{font-size:13px;color:#374151}
.badge{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;
  background:var(--okbg);color:#047857;border:1px solid var(--okbd)}
.badge.warn{background:var(--warnbg);color:#b45309;border-color:var(--warnbd)}
.badge.err{background:var(--errbg);color:#b91c1c;border-color:var(--errbd)}
.cells{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;margin-top:10px}
.cell{background:#f7f9fc;border:1px solid #edf1f7;border-radius:12px;padding:7px 3px 6px;text-align:center}
.cell .b{height:40px;display:flex;align-items:flex-end;justify-content:center}
.cell .b i{width:13px;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,#93c5fd,#3b82f6)}
.cell b{display:block;font-size:11.5px;font-weight:700;margin-top:4px;color:#374151;
  font-variant-numeric:tabular-nums}
.cell s{display:block;font-size:10px;color:var(--dim2);text-decoration:none}
.cell.max{background:var(--okbg);border-color:var(--okbd)}
.cell.max .b i{background:linear-gradient(180deg,#34d399,#10b981)}
.cell.min{background:var(--warnbg);border-color:var(--warnbd)}
.cell.min .b i{background:linear-gradient(180deg,#fbbf24,#f59e0b)}
.cell.bal{box-shadow:inset 0 0 0 2px rgba(59,130,246,.45)}
.row{display:grid;gap:12px;margin-top:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:99px;
  background:#f3f4f6;color:#4b5563;margin:3px 4px 0 0}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--dim2)}
.pill.ok{background:var(--okbg);color:#047857}.pill.ok i{background:var(--ok)}
.pill.warn{background:var(--warnbg);color:#b45309}.pill.warn i{background:var(--warn)}
canvas{width:100%;height:86px;display:block;margin-top:6px}
footer{margin:16px 0 4px;font-size:11px;color:#9aa3b2;text-align:center}
@media(max-width:720px){
  .hero{grid-template-columns:1fr}
  .cells{grid-template-columns:repeat(5,1fr)}
  .v{font-size:23px}
  .soc .num{font-size:46px}
}
</style></head><body>

<header>
  <span class="dot" id="dot"></span>
  <h1 id="dev">蚂蚁 BMS</h1>
  <span class="tag" id="tLink">连接中…</span>
  <span class="tag" id="tSig">4G --</span>
  <span class="spacer"></span>
  <span class="tag" id="tAge">--</span>
</header>

<div class="hero">
  <div class="card soc">
    <div class="num" id="soc">--<span>%</span></div>
    <div class="cap" id="cap">剩余 -- / 满充 --</div>
    <div class="bar"><i id="socbar" style="width:0"></i></div>
    <div class="cap" id="cyc" style="margin-top:12px">循环 --</div>
  </div>
  <div class="stats">
    <div class="card"><div class="k">电池总压</div><div class="v" id="pack">--<small>V</small></div><div class="meta" id="packmeta">压差 --</div></div>
    <div class="card"><div class="k">电流 / 功率</div>
      <div class="v" id="cur">--<small>A</small></div>
      <div class="meta" id="pow">-- W</div>
    </div>
    <div class="card"><div class="k">电池状态</div><div class="v" id="bstate" style="font-size:22px">--</div><div class="meta" id="bsNote">保护板状态</div></div>
    <div class="card"><div class="k">MOS 温度</div><div class="v" id="tmos">--<small>°C</small></div><div class="meta" id="temps">--</div></div>
  </div>
</div>

<div class="card" style="margin-top:12px">
  <div class="sechd">
    <span class="k">单体电压</span><span class="badge" id="ncell">--</span>
    <span class="spacer"></span>
    <span class="meta" id="cellrange">--</span>
    <span class="badge" id="deltaBadge">压差 --</span>
  </div>
  <div class="cells" id="cells"></div>
</div>

<div class="row">
  <div class="card"><div class="k">充电 MOS</div><div class="v" id="cm" style="font-size:20px">--</div><div class="meta" id="cmSub">--</div></div>
  <div class="card"><div class="k">放电 MOS</div><div class="v" id="dm" style="font-size:20px">--</div><div class="meta" id="dmSub">--</div></div>
  <div class="card"><div class="k">均衡</div><div class="v" id="bm" style="font-size:20px">--</div><div class="meta" id="balSub">--</div></div>
  <div class="card"><div class="k">运行时长</div><div class="v" id="rt" style="font-size:20px">--</div><div class="meta">累计运行（板子计数）</div></div>
</div>

<div class="row" style="margin-top:12px">
  <div class="card" style="grid-column:span 2">
    <div class="sechd"><span class="k">电压曲线</span><span class="spacer"></span><span class="meta" id="cvRange">--</span></div>
    <canvas id="cv" width="800" height="172"></canvas>
  </div>
  <div class="card" style="grid-column:span 2">
    <div class="sechd"><span class="k">电流 / 功率曲线</span><span class="spacer"></span><span class="meta" id="cpRange">--</span></div>
    <canvas id="cp" width="800" height="172"></canvas>
  </div>
</div>

<div class="card sec">
  <div class="sechd"><span class="k">链路与设备</span><span class="spacer"></span>
    <span class="badge" id="linkBadge">4G --</span></div>
  <div>
    <span class="pill" id="pBle">BLE --</span>
    <span class="pill" id="pSig">4G --</span>
    <span class="pill" id="pIv">上报 --</span>
    <span class="pill" id="pAge">更新 --</span>
    <span class="pill" id="pFr">帧 --</span>
    <span class="pill" id="pCrc">CRC --</span>
  </div>
</div>

<div class="card sec">
  <div class="sechd"><span class="k">告警 / 保护</span><span class="spacer"></span>
    <span class="badge" id="protBadge">正常</span></div>
  <div id="errs" class="meta" style="margin-top:4px">无保护动作</div>
</div>

<footer>ESP32-C3 + Air780E · MQTT · 每 <span id="ivFoot">2</span> 秒上报</footer>

<script>
const $=id=>document.getElementById(id);
const HIST=120, hv=[], hp=[];
let cellsBuilt=0, lastMsg=0, rtBase=0, rtStamp=0;

// ---------- 极简 MQTT over WebSocket ----------
const BROKER='wss://broker.emqx.io:8084/mqtt';
const TOPIC='jkbms/+/state';
class MiniMqtt{
  constructor(){ this.ws=null; this.buf=new Uint8Array(0); this.onmsg=null; this.onstat=null; }
  connect(){
    try{ this.ws=new WebSocket(BROKER,'mqtt'); }
    catch(e){ this.onstat&&this.onstat(false); setTimeout(()=>this.connect(),3000); return; }
    this.ws.binaryType='arraybuffer';
    this.ws.onopen=()=>{ this._send(this._conn()); this._sub(); this.onstat&&this.onstat(true);
      this._ka=setInterval(()=>{ try{ this._send(new Uint8Array([0xC0,0])); }catch(e){} },30000); };
    this.ws.onmessage=e=>this._feed(new Uint8Array(e.data));
    this.ws.onclose=()=>{ clearInterval(this._ka); this.onstat&&this.onstat(false); setTimeout(()=>this.connect(),3000); };
    this.ws.onerror=()=>{ try{this.ws.close();}catch(e){} };
  }
  _enc(s){ return new TextEncoder().encode(s); }
  _send(u8){ if(this.ws&&this.ws.readyState===1) this.ws.send(u8); }
  _rem(len){ const r=[]; do{ let b=len%128; len=Math.floor(len/128); if(len) b|=0x80; r.push(b);}while(len); return r; }
  _conn(){
    const cid=this._enc('web-'+Math.random().toString(16).slice(2,10));
    const rem=10+2+cid.length;
    return new Uint8Array([0x10].concat(this._rem(rem),[0,4,77,81,84,84,4,2,0,60,0,cid.length],Array.from(cid)));
  }
  _sub(){
    const t=this._enc(TOPIC), rem=2+2+t.length+1;
    this._send(new Uint8Array([0x82].concat(this._rem(rem),[0,1,0,t.length],Array.from(t),[0])));
  }
  _feed(chunk){
    const m=new Uint8Array(this.buf.length+chunk.length);
    m.set(this.buf,0); m.set(chunk,this.buf.length); this.buf=m;
    while(this.buf.length>=2){
      let mul=1,len=0,i=1,b;
      do{ if(i>=this.buf.length) return; b=this.buf[i++]; len+=(b&127)*mul; mul*=128; }while(b&128);
      if(this.buf.length<i+len) return;
      const type=this.buf[0]>>4, s=i, e=i+len;
      if(type===3){
        const tl=(this.buf[s]<<8)|this.buf[s+1];
        const payload=new TextDecoder().decode(this.buf.slice(s+2+tl,e));
        this.onmsg&&this.onmsg(payload);
      }
      this.buf=this.buf.slice(e);
    }
  }
}

// ---------- 工具 ----------
const fmt=(v,d)=> (v===null||v===undefined||isNaN(v)) ? '--' : Number(v).toFixed(d);
function hhmmss(sec){
  sec=Math.floor(sec||0);
  const d=Math.floor(sec/86400), h=Math.floor(sec%86400/3600), m=Math.floor(sec%3600/60), s2=Math.floor(sec%60);
  const p=x=>String(x).padStart(2,'0');
  if(d) return d+'天 '+p(h)+':'+p(m)+':'+p(s2);
  return p(h)+':'+p(m)+':'+p(s2);
}
function deltaLevel(mv){
  if(mv<=10) return ['优秀','badge'];
  if(mv<=30) return ['正常','badge'];
  if(mv<=50) return ['偏大','badge warn'];
  return ['需检查','badge err'];
}
function setPill(el,text,cls){ el.className='pill '+(cls||''); el.textContent=text; }

// ---------- 渲染 ----------
function buildCells(n){
  const box=$('cells'); box.innerHTML='';
  for(let i=0;i<n;i++){
    const d=document.createElement('div'); d.className='cell';
    d.innerHTML='<div class="b"><i style="height:4px"></i></div><b>--</b><s>'+(i+1)+'</s>';
    box.appendChild(d);
  }
  cellsBuilt=n;
}

function render(s){
  lastMsg=Date.now();
  const online=!!s.ble;
  $('dot').className='dot '+(online?'on':'off');
  $('dev').textContent = s.dev ? s.dev : '蚂蚁 BMS';
  $('tLink').className='tag '+(online?'ok':'');
  $('tLink').textContent = online ? 'BLE 已连接' : 'BLE 断开';
  const csq=s.csq||0;
  $('tSig').className='tag '+(csq>0?'ok':'');
  $('tSig').textContent = csq>0 ? ('4G 信号 '+csq) : '4G --';
  $('tAge').textContent = s.age<=6 ? '实时' : ('数据 '+s.age+'s 前');

  const soc=s.soc||0;
  $('soc').innerHTML=soc+'<span>%</span>';
  $('socbar').style.width=soc+'%';
  $('cap').textContent='剩余 '+fmt(s.rem,1)+' / 满充 '+fmt(s.full,1)+' Ah';
  $('cyc').textContent='循环 '+(s.cyc||0)+' 次 · SOH '+(s.soh||0)+' %';

  $('pack').innerHTML=fmt(s.pack,2)+'<small>V</small>';
  const dv=(s.mxv&&s.mnv)?(s.mxv-s.mnv):0;
  const [dl,dcls]=deltaLevel(dv);
  $('deltaBadge').className=dcls; $('deltaBadge').textContent='压差 '+dv+' mV · '+dl;
  $('packmeta').textContent = (s.n||0)+' 串 · 平均 '+fmt((s.pack*1000/ (s.n||1))/1000,3)+' V';

  $('cur').innerHTML=fmt(Math.abs(s.cur),2)+'<small>A</small>';
  $('pow').textContent=fmt(Math.abs(s.pow),0)+' W';

  // 蚂蚁的电流：正 = 放电，负 = 充电；超过 0.1A 就以电流为准，否则用板子给的状态
  const cur=Number(s.cur)||0;
  const active=Math.abs(cur)>=0.1;
  const dir = active ? (cur>0?'放电':'充电') : '待机';
  let bs=s.bs||'--';
  let bsNote='保护板状态';
  if(active){ bs=dir; bsNote='按电流判断'; }
  $('bstate').textContent=bs;
  $('bstate').style.color = (bs==='充电') ? '#047857' : (bs==='放电' ? '#1d4ed8' : '#111827');
  $('bsNote').textContent=bsNote;

  const curColor = (cur>0.1) ? '#1d4ed8' : (cur<-0.1 ? '#047857' : '#111827');
  $('cur').style.color=curColor;
  $('pow').style.color=curColor;

  $('tmos').innerHTML=fmt(s.mos,1)+'<small>°C</small>';
  const ts=(s.t||[]).filter(t=>t!==null&&t>-40&&t<120);
  $('temps').textContent=ts.length?('电芯 '+ts[0].toFixed(1)+' °C'+(ts.length>1?(' · '+ts.length+' 探头'):'')):'无温度探头';

  const cells=s.cells||[];
  if(cells.length!==cellsBuilt) buildCells(cells.length||20);
  const els=$('cells').children;
  const balSet=new Set(s.balc||[]);
  cells.forEach((v,i)=>{
    const el=els[i]; if(!el) return;
    const ok=v>500&&v<6000;
    el.querySelector('b').textContent=ok?fmt(v/1000,3):'--';
    el.querySelector('.b i').style.height=(ok?Math.max(4,Math.min(38,(v-2600)/12)):4)+'px';
    el.classList.toggle('max', ok && v===s.mxv);
    el.classList.toggle('min', ok && v===s.mnv);
    el.classList.toggle('bal', balSet.has(i+1));
    el.querySelector('s').textContent=(i+1)+ (balSet.has(i+1)?' 均衡':'');
  });
  $('ncell').textContent=(s.n||0)+' 串';
  $('cellrange').textContent = s.mxv ? ('最高 #'+s.mxi+' '+fmt(s.mxv/1000,3)+' · 最低 #'+s.mni+' '+fmt(s.mnv/1000,3)) : '--';

  $('cm').textContent=s.cm||'--';
  $('cm').style.color = (s.cm==='开启')?'#047857':((s.cm==='关闭')?'#6b7280':'#b45309');
  $('cmSub').textContent = s.cmos?'导通':'断开';
  $('dm').textContent=s.dm||'--';
  $('dm').style.color = (s.dm==='开启')?'#047857':((s.dm==='关闭')?'#6b7280':'#b45309');
  $('dmSub').textContent = s.dmos?'导通':'断开';
  $('bm').textContent=s.bm||'--';
  $('bm').style.color = (s.bm==='自动均衡'||s.bm==='充电压差均衡')?'#047857':((s.bm==='关闭')?'#6b7280':'#b45309');
  const balList=(s.balc||[]);
  $('balSub').textContent = balList.length ? ('均衡电芯 #'+balList.join(' #')) : '未在均衡';

  $('rt').textContent=hhmmss(s.rt);
  $('rt').style.fontSize='19px'; $('rt').style.whiteSpace='nowrap';

  setPill($('pBle'),'BLE '+(s.brssi||0)+' dBm', online?'ok':'warn');
  setPill($('pSig'),'4G 信号 '+csq, csq>=15?'ok':(csq>0?'warn':'warn'));
  setPill($('pIv'),'上报 '+(s.iv?s.iv/1000:2)+' 秒','');
  setPill($('pAge'),'包序号 '+(s.pk||0),'');
  setPill($('pFr'),'帧 '+(s.fr||0),'');
  setPill($('pCrc'),'CRC 错 '+(s.cc||0), (s.cc>0)?'warn':'');
  $('ivFoot').textContent = s.iv? (s.iv/1000) : 2;
  $('linkBadge').className='badge '+(online&&csq>0?'':'err');
  $('linkBadge').textContent = online ? ('在线 · 信号 '+csq) : '离线';

  const prot=s.prot||0;
  $('protBadge').className='badge '+(prot?'err':'');
  $('protBadge').textContent=prot?'保护动作':'正常';
  $('errs').innerHTML = prot ? ('保护位 <b>0x'+prot.toString(16).toUpperCase().padStart(8,'0')+'</b>')
                             : '无保护动作';

  if(s.pack>0){ hv.push(s.pack); if(hv.length>HIST) hv.shift(); }
  if(s.ble){ hp.push(s.cur||0); if(hp.length>HIST) hp.shift(); }
  chart($('cv'),hv,'#3b82f6',0.02,false,false);
  chart($('cp'),hp,'#10b981',0.5,true,true);
  $('cvRange').textContent = hv.length? (fmt(Math.max(...hv),2)+' / '+fmt(Math.min(...hv),2)+' V') : '--';
  $('cpRange').textContent = hp.length? (fmt(Math.max(...hp),2)+' / '+fmt(Math.min(...hp),2)+' A') : '--';
}

function chart(cv,data,color,step,zeroCenter,isCurrent){
  const ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
  ctx.clearRect(0,0,W,H);
  if(!data||data.length<2) return;
  let mn=Math.min(...data),mx=Math.max(...data);
  if(zeroCenter){ mn=Math.min(mn,0); mx=Math.max(mx,0); }
  if(mx-mn<step*2){ const mid=(mx+mn)/2; mn=mid-step; mx=mid+step; }
  const pad=(mx-mn)*0.18; mn-=pad; mx+=pad;
  const x=i=>i*(W-1)/Math.max(1,data.length-1);
  const y=v=>H-10-((v-mn)/(mx-mn))*(H-24);
  ctx.strokeStyle='#eef1f6'; ctx.lineWidth=1;
  for(let i=0;i<=3;i++){ const yy=10+i*(H-20)/3; ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(W,yy); ctx.stroke(); }
  if(zeroCenter){ ctx.strokeStyle='#e2e8f0'; ctx.beginPath(); ctx.moveTo(0,y(0)); ctx.lineTo(W,y(0)); ctx.stroke(); }
  ctx.beginPath();
  data.forEach((v,i)=>{ const xx=x(i),yy=y(v); if(i)ctx.lineTo(xx,yy); else ctx.moveTo(xx,yy); });
  ctx.strokeStyle=color; ctx.lineWidth=2.2; ctx.lineJoin='round'; ctx.stroke();
  ctx.lineTo(x(data.length-1),H); ctx.lineTo(x(0),H); ctx.closePath();
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,color+'33'); g.addColorStop(1,color+'00');
  ctx.fillStyle=g; ctx.fill();
  ctx.fillStyle='#9aa3b2'; ctx.font='13px sans-serif';
  const lab=v=>v.toFixed(Math.abs(v)<10?2:1);
  ctx.fillText(lab(mx),6,15); ctx.fillText(lab(mn),6,H-3);
}

const mq=new MiniMqtt();
mq.onmsg=p=>{ try{ render(JSON.parse(p)); }catch(e){} };
mq.onstat=ok=>{ if(!ok){ $('dot').className='dot off'; $('tLink').textContent='MQTT 重连中…'; } };
render({}); mq.connect();
setInterval(()=>{ if(lastMsg && Date.now()-lastMsg>30000){ $('tAge').textContent='数据中断'; $('dot').className='dot off'; } },4000);
</script></body></html>
